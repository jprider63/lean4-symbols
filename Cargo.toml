[package]
name = "lean4_symbols"
version = "0.1.0"
authors = ["James Parker <dev@jamesparker.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = [] }
dioxus-free-icons = { version = "0.9", features = ["font-awesome-brands", "bootstrap"] }
dioxus-clipboard = { git="https://github.com/cpt-n3mo/dioxus-clipboard.git", rev="b16c5597f21345a041f1809768a63f13e0fae23a"}
serde_json = "*"
tracing = "*"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
